<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#0A1F40" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="236" fill="url(#blueGrad)" stroke="#3B82F6" stroke-width="12" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />

  <!-- MW Monogram Typography -->
  <text 
    x="256" 
    y="312" 
    font-family="system-ui, -apple-system, sans-serif, 'Arial Black', Roboto" 
    font-size="190" 
    font-weight="900" 
    letter-spacing="-6"
    text-anchor="middle" 
    fill="url(#textGrad)"
    filter="url(#glow)"
  >MW</text>
</svg>