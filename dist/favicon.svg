<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Base in Blue -->
  <circle cx="256" cy="256" r="236" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="14" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" />

  <!-- Letter H Typography -->
  <text 
    x="256" 
    y="345" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
    font-size="260" 
    font-weight="900" 
    letter-spacing="0"
    text-anchor="middle" 
    fill="url(#textGrad)"
    filter="url(#glow)"
  >H</text>
</svg>